<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria - CTIM / EMBRAPII</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .galeria-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2px;
            margin-top: 30px;
        }
        .galeria-grid img {
            width: 100%;
            height: 240px;
            object-fit: contain; /* Mostra a imagem inteira, sem cortes */
            background-color: #f8f9fa; /* Fundo leve para preencher espaços vazios nas laterais */
            border-radius: 8px;
            padding: 8px; /* Dá uma margem interna para a foto respirar */
        }
    </style>
</head>
<body>
    <div class="galeria-container">
        <h1>Galeria de Mídia: Placas Bipolares e Impressão 3D</h1>
        <p>Registro do desenvolvimento de filamentos poliméricos, protótipos impressos e apresentações técnicas (CTIM EMBRAPII / UFABC).</p>
        
        <div class="galeria-grid">
            <!-- Substitua os caminhos pelas suas fotos/vídeos reais na pasta images/ -->
            <img src="images/Ctim (3).jpeg" alt="Processo de Extrusão do Filamento">
            <img src="images/Ctim (7).jpeg" alt="Impressão 3D da Placa Bipolar">
            <img src="images/CTIM(8).jpeg" alt="Protótipo Final da Célula a Combustível">
            <img src="images/CTIM(10).jpg" alt="Protótipo Final da Célula a Combustível">
            <img src="images/CTIM(11).jpg" alt="Protótipo Final da Célula a Combustível">
            <img src="images/CTIM(12).jpg" alt="Protótipo Final da Célula a Combustível">

            <!-- Exemplo de vídeo -->
            <!-- <video controls src="images/ctim-video.mp4"></video> -->
        </div>
        
        <div style="margin-top: 40px;">
            <a href="index.html" class="btn">← Voltar ao Portfólio</a>
        </div>
    </div>
</body>
</html>
